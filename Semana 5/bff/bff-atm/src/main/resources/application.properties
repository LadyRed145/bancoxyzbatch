spring.application.name=bff-atm
server.port=8083
backend.base-url=http://localhost:8080
backend.timeout=${BACKEND_TIMEOUT:3s}

# HTTPS externo del BFF (certificado autofirmado para la demostración académica local)
server.ssl.enabled=true
server.ssl.key-store=classpath:certs/bff-atm.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-atm

# Los tres BFF conocen los tokens académicos para distinguir autenticación (401) de autorización (403).
# En producción estos secretos deben reemplazarse por tokens de corta duración emitidos por un proveedor de identidad.
security.tokens.web=${WEB_API_TOKEN:bancoxyz-web-demo-token-2026}
security.tokens.mobile=${MOBILE_API_TOKEN:bancoxyz-mobile-demo-token-2026}
security.tokens.atm=${ATM_API_TOKEN:bancoxyz-atm-demo-token-2026}

# El ATM ya usa DTO mínimos; mantengo compresión disponible para respuestas que superen el umbral.
server.compression.enabled=true
server.compression.min-response-size=256
server.compression.mime-types=application/json,application/problem+json
