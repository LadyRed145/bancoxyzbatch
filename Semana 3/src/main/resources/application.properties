spring.application.name=bancoxyzbatch

# ===============================
# PostgreSQL
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bancoxyz}
spring.datasource.username=${DB_USER:bancoxyz}
spring.datasource.password=${DB_PASSWORD:bancoxyz123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mantengo conexiones suficientes para los procesos concurrentes.
spring.datasource.hikari.maximum-pool-size=10


# ===============================
# Inicialización SQL
# ===============================

# Inicializo de forma controlada e idempotente las tablas internas
# requeridas por Spring Batch en PostgreSQL.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-spring-batch-postgresql.sql


# ===============================
# Spring Batch
# ===============================

# Evito la ejecución automática de todos los Jobs.
# ControlledJobRunner determina cuál proceso ejecutar.
spring.batch.job.enabled=false


# ===============================
# JPA / Hibernate
# ===============================

# Mantengo sincronizadas las tablas correspondientes
# al modelo de negocio.
spring.jpa.hibernate.ddl-auto=update

# Reduzco ruido SQL durante las ejecuciones y mediciones.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# ===============================
# Escalamiento y rendimiento
# ===============================

# Configuración óptima obtenida mediante pruebas controladas
# sobre el dataset actual de 1000 registros.
#
# Benchmark de hilos con chunk-size=10:
#
# 1 hilo  -> promedio 7931.971 ms
# 2 hilos -> promedio 5465.317 ms
# 3 hilos -> promedio 4883.985 ms
# 4 hilos -> promedio 5373.557 ms
#
# Se seleccionan 3 hilos por presentar el menor tiempo
# promedio entre las configuraciones evaluadas.
#
# Benchmark de chunks con threads=3:
#
# chunk=5  -> promedio 6519.185 ms
# chunk=10 -> promedio 5865.691 ms
# chunk=25 -> FAILED por saturación del TaskExecutor
# chunk=50 -> FAILED por saturación del TaskExecutor
#
# Las configuraciones chunk=25 y chunk=50 saturaron el
# executor con 3 hilos activos y queue-capacity=20,
# provocando TaskRejectedException / RejectedExecutionException.
#
# Se selecciona chunk-size=10 por presentar el mejor
# rendimiento entre las configuraciones estables.

app.batch.threads=3
app.batch.queue-capacity=20
app.batch.chunk-size=10


# ===============================
# Tolerancia a fallos
# ===============================

# Cantidad máxima de registros que un Step puede omitir de forma
# controlada debido a errores de formato o reglas de negocio.
#
# El dataset legacy actual contiene una cantidad significativa
# de registros incorrectos y mal clasificados.
#
# Se establece un límite de 750 para permitir su procesamiento
# y trazabilidad sin aceptar silenciosamente un archivo
# completamente corrupto.
app.batch.skip-limit=750


# ===============================
# Resiliencia / Retry
# ===============================

# Cantidad máxima de reintentos ante fallos transitorios.
app.batch.retry-max-retries=3

# Tiempo de espera entre reintentos, expresado en milisegundos.
app.batch.retry-delay-ms=500


# ===============================
# Prueba controlada de retry
# ===============================

# Permite simular fallos transitorios para validar
# experimentalmente la política de reintentos.
#
# Durante la ejecución normal debe permanecer en 0.
# Para una prueba controlada puede establecerse temporalmente
# en un valor mayor que 0.
app.batch.retry-demo-failures=0
