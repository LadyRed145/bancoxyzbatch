# ============================================
# BancoXYZ - Retiros Event Consumer
# ============================================

spring.application.name=retiros-event-consumer
server.port=8090

# ============================================
# Kafka
# ============================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=bancoxyz-retiros-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.bancoxyz.event

# ============================================
# Eureka
# ============================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

# ============================================
# Actuator
# ============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ============================================
# Spring Security / OAuth2
# ============================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8084/realms/bancoxyz}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:8084/realms/bancoxyz/protocol/openid-connect/certs}
