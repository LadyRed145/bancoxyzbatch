spring.application.name=clientes-service
server.port=${CLIENTES_SERVICE_PORT:8093}
spring.datasource.url=${CLIENTES_SERVICE_DB_URL}
spring.datasource.username=${CLIENTES_SERVICE_DB_USER}
spring.datasource.password=${CLIENTES_SERVICE_DB_PASSWORD}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLIENTES_SERVICE_JWT_ISSUER_URI}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false
management.endpoints.web.exposure.include=health,info

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLIENTES_SERVICE_JWK_SET_URI:}
