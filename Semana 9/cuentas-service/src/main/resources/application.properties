spring.application.name=cuentas-service
server.port=${CUENTAS_PORT:8092}
# Configuracion obligatoria: apuntar exclusivamente al PostgreSQL de pruebas.
spring.datasource.url=${CUENTAS_DB_URL}
spring.datasource.username=${CUENTAS_DB_USER}
spring.datasource.password=${CUENTAS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V2__cuentas_gestion.sql
spring.sql.init.continue-on-error=false
# JWT debe validarse contra el emisor configurado; no usar fallback.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CUENTAS_JWT_ISSUER_URI}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
