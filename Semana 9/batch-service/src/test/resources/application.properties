spring.datasource.url=jdbc:h2:mem:bancoxyz_batch_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.batch.threads=2
app.batch.queue-capacity=10
app.batch.chunk-size=10
app.batch.skip-limit=750
app.batch.retry-max-retries=3
app.batch.retry-delay-ms=1
app.batch.retry-demo-failures=0
app.batch.critical-restart-attempts=1
