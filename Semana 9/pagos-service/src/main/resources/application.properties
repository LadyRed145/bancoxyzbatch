spring.application.name=pagos-service
server.port=${PAGOS_SERVICE_PORT:8094}
spring.datasource.url=${PAGOS_SERVICE_DB_URL}
spring.datasource.username=${PAGOS_SERVICE_DB_USER}
spring.datasource.password=${PAGOS_SERVICE_DB_PASSWORD}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${PAGOS_SERVICE_JWT_ISSUER_URI}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false
management.endpoints.web.exposure.include=health,info

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${PAGOS_SERVICE_JWK_SET_URI:}
