services:
  postgres:
    image: postgres:17
    container_name: bancoxyz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bancoxyz}
      POSTGRES_USER: ${POSTGRES_USER:-bancoxyz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bancoxyz_postgres_data:/var/lib/postgresql/data
      - "./Semana 8/database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro"
      - "./Semana 8/database/02_seed_processed_snapshot.sql:/docker-entrypoint-initdb.d/02_seed_processed_snapshot.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bancoxyz} -d ${POSTGRES_DB:-bancoxyz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bancoxyz-net

  kafka-1:
    image: apache/kafka:4.0.0
    container_name: bancoxyz-kafka-1
    hostname: kafka-1
    restart: unless-stopped
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    volumes:
      - bancoxyz_kafka_1_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms256m -Xmx384m}"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - bancoxyz-net

  kafka-2:
    image: apache/kafka:4.0.0
    container_name: bancoxyz-kafka-2
    hostname: kafka-2
    restart: unless-stopped
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    volumes:
      - bancoxyz_kafka_2_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms256m -Xmx384m}"
    ports:
      - "127.0.0.1:9094:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - bancoxyz-net

  kafka-3:
    image: apache/kafka:4.0.0
    container_name: bancoxyz-kafka-3
    hostname: kafka-3
    restart: unless-stopped
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    volumes:
      - bancoxyz_kafka_3_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:19092,EXTERNAL://localhost:9096"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms256m -Xmx384m}"
    ports:
      - "127.0.0.1:9096:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - bancoxyz-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: bancoxyz-kafka-ui
    restart: unless-stopped
    mem_limit: ${KAFKA_UI_MEM_LIMIT:-256m}
    environment:
      KAFKA_CLUSTERS_0_NAME: bancoxyz-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_BIND:-127.0.0.1}:8090:8080"
    networks:
      - bancoxyz-net


  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: bancoxyz-keycloak
    restart: unless-stopped
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1g}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME requerido}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD requerido}"
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL requerido}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "${KEYCLOAK_JAVA_OPTS_KC_HEAP:--XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=60}"
      OAUTH2_WEB_CLIENT_SECRET: "${OAUTH2_WEB_CLIENT_SECRET:?OAUTH2_WEB_CLIENT_SECRET requerido}"
      OAUTH2_MOBILE_CLIENT_SECRET: "${OAUTH2_MOBILE_CLIENT_SECRET:?OAUTH2_MOBILE_CLIENT_SECRET requerido}"
      OAUTH2_ATM_CLIENT_SECRET: "${OAUTH2_ATM_CLIENT_SECRET:?OAUTH2_ATM_CLIENT_SECRET requerido}"
    ports:
      - "8084:8080"
    volumes:
      - "./Semana 8/keycloak/bancoxyz-realm.json:/opt/keycloak/data/import/bancoxyz-realm.json:ro"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - bancoxyz-net


  config-server:
    build:
      context: "./Semana 8/config-server"
    container_name: bancoxyz-config-server
    restart: unless-stopped
    environment:
      CONFIG_REPO_PATH: file:/config-repo
    volumes:
      - "./Semana 8/config-repo:/config-repo:ro"
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - bancoxyz-net


  discovery-server:
    build:
      context: "./Semana 8/discovery-server"
    container_name: bancoxyz-discovery-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - bancoxyz-net

  bank-backend:
    build:
      context: "./Semana 8/bank-backend"
    container_name: bancoxyz-bank-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bancoxyz}
      DB_USER: ${POSTGRES_USER:-bancoxyz}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: bank-backend
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - bancoxyz-net

  retiros-event-consumer:
    build:
      context: "./Semana 8/retiros-event-consumer"
    container_name: bancoxyz-retiros-event-consumer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: retiros-event-consumer
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI requerido}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # API administrativa Kafka: localhost por defecto.
    # En EC2 sólo exponerla si es necesario y restringir 8091 por Security Group.
    ports:
      - "${CONSUMER_ADMIN_BIND:-127.0.0.1}:8091:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - bancoxyz-net

  bff-web:
    build:
      context: "./Semana 8/bff/bff-web"
    container_name: bancoxyz-bff-web
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: bff-web
      BACKEND_BASE_URL: http://bank-backend
      BACKEND_TIMEOUT: ${BACKEND_TIMEOUT:-3s}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI requerido}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?SSL_KEYSTORE_PASSWORD requerido}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_WAIT_DURATION: ${RETRY_WAIT_DURATION:-200ms}
      RATE_LIMIT_FOR_PERIOD: ${RATE_LIMIT_FOR_PERIOD:-10}
      RATE_LIMIT_REFRESH_PERIOD: ${RATE_LIMIT_REFRESH_PERIOD:-1s}
      RATE_LIMIT_TIMEOUT: ${RATE_LIMIT_TIMEOUT:-0ms}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      bank-backend:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fkSs https://localhost:8081/actuator/health/liveness >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - bancoxyz-net

  bff-mobile:
    build:
      context: "./Semana 8/bff/bff-mobile"
    container_name: bancoxyz-bff-mobile
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: bff-mobile
      BACKEND_BASE_URL: http://bank-backend
      BACKEND_TIMEOUT: ${BACKEND_TIMEOUT:-3s}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI requerido}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?SSL_KEYSTORE_PASSWORD requerido}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_WAIT_DURATION: ${RETRY_WAIT_DURATION:-200ms}
      RATE_LIMIT_FOR_PERIOD: ${RATE_LIMIT_FOR_PERIOD:-10}
      RATE_LIMIT_REFRESH_PERIOD: ${RATE_LIMIT_REFRESH_PERIOD:-1s}
      RATE_LIMIT_TIMEOUT: ${RATE_LIMIT_TIMEOUT:-0ms}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      bank-backend:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fkSs https://localhost:8082/actuator/health/liveness >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - bancoxyz-net

  bff-atm:
    build:
      context: "./Semana 8/bff/bff-atm"
    container_name: bancoxyz-bff-atm
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: bff-atm
      BACKEND_BASE_URL: http://bank-backend
      BACKEND_TIMEOUT: ${BACKEND_TIMEOUT:-3s}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI requerido}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?SSL_KEYSTORE_PASSWORD requerido}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_WAIT_DURATION: ${RETRY_WAIT_DURATION:-200ms}
      RATE_LIMIT_FOR_PERIOD: ${RATE_LIMIT_FOR_PERIOD:-10}
      RATE_LIMIT_REFRESH_PERIOD: ${RATE_LIMIT_REFRESH_PERIOD:-1s}
      RATE_LIMIT_TIMEOUT: ${RATE_LIMIT_TIMEOUT:-0ms}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      bank-backend:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fkSs https://localhost:8083/actuator/health/liveness >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - bancoxyz-net

volumes:
  bancoxyz_postgres_data:

  bancoxyz_kafka_1_data:
  bancoxyz_kafka_2_data:
  bancoxyz_kafka_3_data:
networks:
  bancoxyz-net:
    driver: bridge
