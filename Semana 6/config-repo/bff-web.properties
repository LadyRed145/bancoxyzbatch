# ============================================
# BancoXYZ - Configuración centralizada BFF Web
# ============================================

# ============================================
# Bank Backend mediante Service Discovery
# ============================================

# Eureka + Spring Cloud LoadBalancer resuelven
# automáticamente la instancia de BANK-BACKEND.
backend.base-url=${BACKEND_BASE_URL:http://bank-backend}

# Timeout reactivo controlado por BankBackendClient.
backend.timeout=${BACKEND_TIMEOUT:3s}

# ============================================
# Compresión HTTP
# ============================================

server.compression.enabled=true
server.compression.min-response-size=256
server.compression.mime-types=application/json,application/problem+json

# ============================================
# Eureka Service Discovery
# ============================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka/}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}

eureka.instance.instance-id=${spring.application.name}:${server.port}

# ============================================
# Spring Cloud LoadBalancer
# ============================================

spring.cloud.loadbalancer.enabled=true
spring.cloud.loadbalancer.eager-load.clients=bank-backend

# ============================================
# Resilience4j - Circuit Breaker
# ============================================

# BankBackendClient ya posee su propio timeout reactivo.
# Desactivamos el TimeLimiter de Spring Cloud para evitar
# dos mecanismos de timeout compitiendo sobre la misma llamada.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

# Para esta etapa usamos Circuit Breaker sin Bulkhead.
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false

# Ventana de las últimas 5 llamadas.
resilience4j.circuitbreaker.instances.bankbackend.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bankbackend.sliding-window-size=5

# Comienza a calcular fallos después de 3 llamadas.
resilience4j.circuitbreaker.instances.bankbackend.minimum-number-of-calls=3

# Abre el circuito cuando el 50% o más falla.
resilience4j.circuitbreaker.instances.bankbackend.failure-rate-threshold=50

# Permanece OPEN 10 segundos antes de probar recuperación.
resilience4j.circuitbreaker.instances.bankbackend.wait-duration-in-open-state=10s

# En HALF_OPEN permite dos llamadas de prueba.
resilience4j.circuitbreaker.instances.bankbackend.permitted-number-of-calls-in-half-open-state=2

# Transición automática OPEN -> HALF_OPEN.
resilience4j.circuitbreaker.instances.bankbackend.automatic-transition-from-open-to-half-open-enabled=true

# Sólo los fallos técnicos que normalizamos deben afectar
# el estado del Circuit Breaker.
resilience4j.circuitbreaker.instances.bankbackend.record-exceptions=cl.duoc.bancoxyz.bffweb.exception.BackendNoDisponibleException,cl.duoc.bancoxyz.bffweb.exception.BackendTimeoutException

# ============================================
# Evidencia Config Server
# ============================================

bancoxyz.config.source=centralizada-semana6

# Buffer de eventos para evidencia mediante Actuator.
resilience4j.circuitbreaker.instances.bankbackend.event-consumer-buffer-size=50

# ============================================
# Resilience4j - Retry
# ============================================

# Tres intentos totales: llamada inicial + hasta dos reintentos.
resilience4j.retry.instances.bankbackend.max-attempts=${RETRY_MAX_ATTEMPTS:3}
resilience4j.retry.instances.bankbackend.wait-duration=${RETRY_WAIT_DURATION:200ms}
resilience4j.retry.instances.bankbackend.retry-exceptions=cl.duoc.bancoxyz.bffweb.exception.BackendNoDisponibleException,cl.duoc.bancoxyz.bffweb.exception.BackendTimeoutException
resilience4j.retry.instances.bankbackend.event-consumer-buffer-size=50

# ============================================
# Resilience4j - Rate Limiter
# ============================================

resilience4j.ratelimiter.instances.bankbackend.limit-for-period=${RATE_LIMIT_FOR_PERIOD:10}
resilience4j.ratelimiter.instances.bankbackend.limit-refresh-period=${RATE_LIMIT_REFRESH_PERIOD:1s}
resilience4j.ratelimiter.instances.bankbackend.timeout-duration=${RATE_LIMIT_TIMEOUT:0ms}
resilience4j.ratelimiter.instances.bankbackend.event-consumer-buffer-size=50

# ============================================
# Spring Boot Actuator / Observabilidad
# ============================================

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,ratelimiters,ratelimiterevents
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
