services:
  cuentas-service:
    build:
      context: .
      dockerfile: Semana 9/cuentas-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_APPLICATION_NAME: cuentas-service
      SERVER_PORT: '8080'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bancoxyz}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bancoxyz}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI
        requerido}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8080/actuator/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      replicas: ${CUENTAS_REPLICAS:-1}
      resources:
        limits:
          memory: 512M
    networks:
    - bancoxyz-net
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bancoxyz}
      POSTGRES_USER: ${POSTGRES_USER:-bancoxyz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    ports:
    - 127.0.0.1:15432:5432
    volumes:
    - bancoxyz_postgres_data:/var/lib/postgresql/data
    - ./Semana 9/database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    - ./Semana 9/data/db/03_retiros_idempotencia.sql:/docker-entrypoint-initdb.d/03_retiros_idempotencia.sql:ro
    - ./Semana 9/batch-service/src/main/resources/db/schema-spring-batch-postgresql.sql:/docker-entrypoint-initdb.d/04_batch_schema.sql:ro
    - ./Semana 9/batch-service/src/main/resources/db/schema-registros-rechazados.sql:/docker-entrypoint-initdb.d/05_rechazados.sql:ro
    - ./Semana 9/cuentas-service/src/main/resources/db/migration/V2__cuentas_gestion.sql:/docker-entrypoint-initdb.d/06_cuentas.sql:ro
    - ./Semana 9/clientes-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/07_clientes.sql:ro
    - ./Semana 9/pagos-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/08_pagos.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-bancoxyz} -d ${POSTGRES_DB:-bancoxyz}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - bancoxyz-net
  kafka-1:
    image: apache/kafka:4.0.0
    hostname: kafka-1
    restart: unless-stopped
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    volumes:
    - bancoxyz_kafka_1_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx384m}
    ports:
    - 127.0.0.1:19092:9092
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092
        >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
    - bancoxyz-net
  kafka-2:
    image: apache/kafka:4.0.0
    hostname: kafka-2
    restart: unless-stopped
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    volumes:
    - bancoxyz_kafka_2_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: '2'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:19094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx384m}
    ports:
    - 127.0.0.1:19094:9092
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092
        >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
    - bancoxyz-net
  kafka-3:
    image: apache/kafka:4.0.0
    hostname: kafka-3
    restart: unless-stopped
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    volumes:
    - bancoxyz_kafka_3_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: '3'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:19096
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx384m}
    ports:
    - 127.0.0.1:19096:9092
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092
        >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
    - bancoxyz-net
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    mem_limit: ${KAFKA_UI_MEM_LIMIT:-512m}
    environment:
      KAFKA_CLUSTERS_0_NAME: bancoxyz-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      DYNAMIC_CONFIG_ENABLED: 'false'
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
    - 127.0.0.1:18090:8080
    networks:
    - bancoxyz-net
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1g}
    command:
    - ${KEYCLOAK_START_COMMAND:-start-dev}
    - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bancoxyz}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA:-public}
      KC_DB_USERNAME: ${POSTGRES_USER:-bancoxyz}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME
        requerido}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD
        requerido}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL requerido}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_JAVA_OPTS_KC_HEAP:--XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=60}
      OAUTH2_WEB_CLIENT_SECRET: ${OAUTH2_WEB_CLIENT_SECRET:?OAUTH2_WEB_CLIENT_SECRET
        requerido}
      OAUTH2_MOBILE_CLIENT_SECRET: ${OAUTH2_MOBILE_CLIENT_SECRET:?OAUTH2_MOBILE_CLIENT_SECRET
        requerido}
      OAUTH2_ATM_CLIENT_SECRET: ${OAUTH2_ATM_CLIENT_SECRET:?OAUTH2_ATM_CLIENT_SECRET
        requerido}
    ports:
    - 127.0.0.1:18084:8080
    volumes:
    - ./Semana 9/keycloak/bancoxyz-realm.json:/opt/keycloak/data/import/bancoxyz-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - '{ printf ''HEAD /health/ready HTTP/1.0\r\n\r\n'' >&0; grep ''HTTP/1.0 200'';
        } 0<>/dev/tcp/127.0.0.1/9000'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
    - bancoxyz-net
  caddy:
    profiles:
    - ec2
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN:-localhost}
      TLS_EMAIL: ${TLS_EMAIL:-admin@example.com}
    ports:
    - 127.0.0.1:18000:80
    - 127.0.0.1:18443:443
    - 127.0.0.1:18443:443/udp
    volumes:
    - ./Semana 9/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - bancoxyz_caddy_data:/data
    - bancoxyz_caddy_config:/config
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://127.0.0.1:2019/config/ || exit
        1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
    - bancoxyz-net
  config-server:
    build:
      context: ./Semana 9/config-server
    restart: unless-stopped
    environment:
      CONFIG_REPO_PATH: file:/config-repo
    volumes:
    - ./Semana 9/config-repo:/config-repo:ro
    ports:
    - 127.0.0.1:18888:8888
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8888/actuator/health >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
    - bancoxyz-net
  discovery-server:
    build:
      context: ./Semana 9/discovery-server
    restart: unless-stopped
    ports:
    - 127.0.0.1:18761:8761
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8761/actuator/health >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
    - bancoxyz-net
  bank-backend:
    build:
      context: .
      dockerfile: ./Semana 9/bank-backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bancoxyz}
      DB_USER: ${POSTGRES_USER:-bancoxyz}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      EUREKA_INSTANCE_HOSTNAME: bank-backend
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:19092,kafka-2:19092,kafka-3:19092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI requerido}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
    - 127.0.0.1:18080:8080
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8080/actuator/health >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
    - bancoxyz-net
  retiros-event-consumer:
    build:
      context: .
      dockerfile: ./Semana 9/retiros-event-consumer/Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:19092,kafka-2:19092,kafka-3:19092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      EUREKA_INSTANCE_HOSTNAME: retiros-event-consumer
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI requerido}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
    - 127.0.0.1:18091:8090
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8090/actuator/health >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
    - bancoxyz-net
  bff-web:
    build:
      context: .
      dockerfile: ./Semana 9/bff/bff-web/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      EUREKA_INSTANCE_HOSTNAME: bff-web
      BACKEND_BASE_URL: http://bank-backend
      BACKEND_TIMEOUT: ${BACKEND_TIMEOUT:-3s}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI requerido}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?SSL_KEYSTORE_PASSWORD requerido}
      SERVER_SSL_KEY_STORE: file:/run/certs/bff-web.p12
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_WAIT_DURATION: ${RETRY_WAIT_DURATION:-200ms}
      RATE_LIMIT_FOR_PERIOD: ${RATE_LIMIT_FOR_PERIOD:-10}
      RATE_LIMIT_REFRESH_PERIOD: ${RATE_LIMIT_REFRESH_PERIOD:-1s}
      RATE_LIMIT_TIMEOUT: ${RATE_LIMIT_TIMEOUT:-0ms}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      bank-backend:
        condition: service_healthy
      cuentas-service:
        condition: service_healthy
    volumes:
    - type: bind
      source: ./Semana 9/bff/bff-web/src/main/resources/certs/bff-web.p12
      target: /run/certs/bff-web.p12
      read_only: true
      bind:
        create_host_path: false
    ports:
    - 127.0.0.1:18081:8081
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fkSs https://localhost:8081/actuator/health/liveness >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
    - bancoxyz-net
  bff-mobile:
    build:
      context: .
      dockerfile: ./Semana 9/bff/bff-mobile/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      EUREKA_INSTANCE_HOSTNAME: bff-mobile
      BACKEND_BASE_URL: http://bank-backend
      BACKEND_TIMEOUT: ${BACKEND_TIMEOUT:-3s}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI requerido}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?SSL_KEYSTORE_PASSWORD requerido}
      SERVER_SSL_KEY_STORE: file:/run/certs/bff-mobile.p12
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_WAIT_DURATION: ${RETRY_WAIT_DURATION:-200ms}
      RATE_LIMIT_FOR_PERIOD: ${RATE_LIMIT_FOR_PERIOD:-10}
      RATE_LIMIT_REFRESH_PERIOD: ${RATE_LIMIT_REFRESH_PERIOD:-1s}
      RATE_LIMIT_TIMEOUT: ${RATE_LIMIT_TIMEOUT:-0ms}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      bank-backend:
        condition: service_healthy
      cuentas-service:
        condition: service_healthy
    volumes:
    - type: bind
      source: ./Semana 9/bff/bff-mobile/src/main/resources/certs/bff-mobile.p12
      target: /run/certs/bff-mobile.p12
      read_only: true
      bind:
        create_host_path: false
    ports:
    - 127.0.0.1:18082:8082
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fkSs https://localhost:8082/actuator/health/liveness >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
    - bancoxyz-net
  bff-atm:
    build:
      context: .
      dockerfile: ./Semana 9/bff/bff-atm/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      EUREKA_INSTANCE_HOSTNAME: bff-atm
      BACKEND_BASE_URL: http://bank-backend
      BACKEND_TIMEOUT: ${BACKEND_TIMEOUT:-3s}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI requerido}
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/bancoxyz/protocol/openid-connect/certs
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?SSL_KEYSTORE_PASSWORD requerido}
      SERVER_SSL_KEY_STORE: file:/run/certs/bff-atm.p12
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_WAIT_DURATION: ${RETRY_WAIT_DURATION:-200ms}
      RATE_LIMIT_FOR_PERIOD: ${RATE_LIMIT_FOR_PERIOD:-10}
      RATE_LIMIT_REFRESH_PERIOD: ${RATE_LIMIT_REFRESH_PERIOD:-1s}
      RATE_LIMIT_TIMEOUT: ${RATE_LIMIT_TIMEOUT:-0ms}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      bank-backend:
        condition: service_healthy
      cuentas-service:
        condition: service_healthy
    volumes:
    - type: bind
      source: ./Semana 9/bff/bff-atm/src/main/resources/certs/bff-atm.p12
      target: /run/certs/bff-atm.p12
      read_only: true
      bind:
        create_host_path: false
    ports:
    - 127.0.0.1:18083:8083
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fkSs https://localhost:8083/actuator/health/liveness >/dev/null
