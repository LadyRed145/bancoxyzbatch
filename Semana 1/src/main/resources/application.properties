spring.application.name=bancoxyzbatch

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bancoxyz}
spring.datasource.username=${DB_USER:bancoxyz}
spring.datasource.password=${DB_PASSWORD:bancoxyz123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Spring Batch
# ===============================
spring.batch.job.enabled=false
